# Clustered event bus overlay (VERTICLES.md stage 6). Opt-in:
#
#   docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d
#
# web-api and the exporter join a Vert.x cluster (vertx-infinispan, TCPPING
# static discovery) over the private `cluster` network — bus facts reach the
# exporter sub-second instead of at the poll interval. Both run as JVM
# containers here: the cluster manager is the one piece not yet proven under
# GraalVM native (the documented fallback); everything else stays native.
#
# Addressing is fully static (cluster-net IPs, not names): the services sit on
# two networks, so interface-guessing binds (match-interface:eth0) and DNS
# (which answers with a per-network IP) can disagree — a node then listens on
# one network while peers dial the other, and discovery never converges.
# Static IPs pin membership (JGroups :7800), discovery, and the event-bus
# message transport (Vert.x's own TCP server, :15701 — a SEPARATE socket from
# the JGroups channel; its default bind is localhost, which silently drops
# every remote delivery) to the same interface.
#
# SECURITY: the cluster network is internal-only and must stay that way —
# bus membership is access (VERTICLES.md). Never publish 7800 or 15701.
services:

  inventory-web-api:
    build:
      context: inventory-web-api
      dockerfile: src/main/docker/Dockerfile.jvm
    image: inventory-web-api:jvm
    environment:
      INVENTORY_EVENTS_BUS: clustered
      QUARKUS_VERTX_CLUSTER_CLUSTERED: "true"
      QUARKUS_VERTX_CLUSTER_HOST: 172.28.0.11
      QUARKUS_VERTX_CLUSTER_PORT: "15701"
      JAVA_TOOL_OPTIONS: >-
        -Djgroups.bind.address=172.28.0.11
        -Djgroups.tcpping.initial_hosts=172.28.0.11[7800],172.28.0.12[7800]
        -Djava.net.preferIPv4Stack=true
    networks:
      default:
      cluster:
        ipv4_address: 172.28.0.11

  inventory-exporter:
    build:
      context: inventory-exporter
      dockerfile: src/main/docker/Dockerfile.jvm
    image: inventory-exporter:jvm
    environment:
      INVENTORY_EVENTS_BUS: clustered
      QUARKUS_VERTX_CLUSTER_CLUSTERED: "true"
      QUARKUS_VERTX_CLUSTER_HOST: 172.28.0.12
      QUARKUS_VERTX_CLUSTER_PORT: "15701"
      # long poll interval proves the bus nudge is doing the live work;
      # reconciliation still sweeps anything the bus dropped
      INVENTORY_EXPORTER_POLL_INTERVAL_MS: "30000"
      JAVA_TOOL_OPTIONS: >-
        -Djgroups.bind.address=172.28.0.12
        -Djgroups.tcpping.initial_hosts=172.28.0.11[7800],172.28.0.12[7800]
        -Djava.net.preferIPv4Stack=true
    networks:
      default:
      cluster:
        ipv4_address: 172.28.0.12

networks:
  cluster:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
