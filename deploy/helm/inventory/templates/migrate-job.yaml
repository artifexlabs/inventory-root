# Liquibase to completion before the apps (upgrade) or right after install —
# the compose `migrate` service as a Helm hook. The init container waits for
# postgres, mirroring compose's service_healthy condition.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-migrate
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-migrate
        {{- include "inventory.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U inventory -d inventory; do sleep 2; done
      containers:
        - name: migrate
          image: liquibase/liquibase:4.29
          args:
            - --url=jdbc:postgresql://postgres:5432/inventory
            - --username=inventory
            - --password=$(POSTGRES_PASSWORD)
            - --search-path=/liquibase/changelog
            - --changelog-file=db/changelog-master.yaml
            - update
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: postgres-password
          volumeMounts:
            - name: changelog
              mountPath: /liquibase/changelog
              readOnly: true
      volumes:
        - name: changelog
          configMap:
            name: inventory-changelog
            # the ConfigMap is flat (basename keys); rebuild the db/ tree the
            # master changelog's include paths expect. A NEW changeset needs
            # a new item here AND a fresh copy under files/changelog/.
            items:
              - key: changelog-master.yaml
                path: db/changelog-master.yaml
              - key: 001-core.yaml
                path: db/changeset/001-core.yaml
              - key: 002-assets.yaml
                path: db/changeset/002-assets.yaml
              - key: 003-identity.yaml
                path: db/changeset/003-identity.yaml
              - key: 004-audit.yaml
                path: db/changeset/004-audit.yaml
              - key: 005-item-identities.yaml
                path: db/changeset/005-item-identities.yaml
