# Liquibase to completion before the apps (upgrade) or right after install —
# the compose `migrate` service as a Helm hook. The init container waits for
# postgres, mirroring compose's service_healthy condition.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-migrate
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-migrate
        {{- include "inventory.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U inventory -d inventory; do sleep 2; done
      containers:
        - name: migrate
          # the versioned schema: Liquibase + the inventory-impl-changeset
          # jar on its classpath (changelog-from-jar) — the hand-copied
          # ConfigMap and its drift rule are gone.
          image: {{ include "inventory.image" (dict "root" . "module" "inventory-migrate") }}
          args:
            - --url=jdbc:postgresql://postgres:5432/inventory
            - --username=inventory
            - --password=$(POSTGRES_PASSWORD)
            - --changelog-file=db/changelog-master.yaml
            - update
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: postgres-password
