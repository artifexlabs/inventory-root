# The authenticated HTTP gateway — the only API entrypoint. Requires the bus
# fabric (remote workers): no cluster, no API.
apiVersion: v1
kind: Service
metadata:
  name: inventory-web-api
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webApi.serviceType }}
  selector:
    app.kubernetes.io/name: inventory-web-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8081
---
# The bus fabric ports ride a SEPARATE, always-ClusterIP service so no
# serviceType choice above can ever expose them (never publish 7800/15701 —
# bus membership is access).
apiVersion: v1
kind: Service
metadata:
  name: inventory-web-api-bus
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: inventory-web-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: jgroups
      port: 7800
    - name: eventbus
      port: 15701
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-web-api
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-web-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-web-api
        {{- include "inventory.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inventory-web-api
          image: {{ include "inventory.image" (dict "root" . "module" "inventory-web-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: INVENTORY_BUS_WORKERS
              value: remote
            - name: INVENTORY_BUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: bus-token
            - name: QUARKUS_DEVSERVICES_ENABLED
              value: "false"
            - name: INVENTORY_QR_BASE_URL
              value: {{ .Values.qrBaseUrl | quote }}
            - name: QUARKUS_VERTX_CLUSTER_CLUSTERED
              value: "true"
            - name: QUARKUS_VERTX_CLUSTER_HOST
              value: "$(POD_IP)"
            - name: QUARKUS_VERTX_CLUSTER_PORT
              value: "15701"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djgroups.bind.address=$(POD_IP)
                -Djgroups.tcpping.initial_hosts=inventory-server[7800],inventory-web-api-bus[7800],inventory-projector-bus[7800]
                -Djava.net.preferIPv4Stack=true
          ports:
            - name: http
              containerPort: 8081
            - name: jgroups
              containerPort: 7800
            - name: eventbus
              containerPort: 15701
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
