# Reference fact consumer: pages audit_events from a durable cursor (fully
# correct alone); cluster membership upgrades it to sub-second push.
apiVersion: v1
kind: Service
metadata:
  name: inventory-exporter
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.exporter.serviceType }}
  selector:
    app.kubernetes.io/name: inventory-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8083
---
# Bus fabric ports on a SEPARATE, always-ClusterIP service (never publish
# 7800/15701 — bus membership is access).
apiVersion: v1
kind: Service
metadata:
  name: inventory-exporter-bus
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: inventory-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: jgroups
      port: 7800
    - name: eventbus
      port: 15701
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-exporter
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-exporter
        {{- include "inventory.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inventory-exporter
          image: {{ include "inventory.image" (dict "root" . "module" "inventory-exporter") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: postgresql://postgres:5432/inventory
            - name: QUARKUS_DATASOURCE_USERNAME
              value: inventory
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-secrets
                  key: postgres-password
            - name: QUARKUS_DEVSERVICES_ENABLED
              value: "false"
            - name: INVENTORY_EVENTS_BUS
              value: clustered
            - name: QUARKUS_VERTX_CLUSTER_CLUSTERED
              value: "true"
            - name: QUARKUS_VERTX_CLUSTER_HOST
              value: "$(POD_IP)"
            - name: QUARKUS_VERTX_CLUSTER_PORT
              value: "15701"
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Djgroups.bind.address=$(POD_IP)
                -Djgroups.tcpping.initial_hosts=inventory-server[7800],inventory-web-api-bus[7800],inventory-exporter-bus[7800]
                -Djava.net.preferIPv4Stack=true
          ports:
            - name: http
              containerPort: 8083
            - name: jgroups
              containerPort: 7800
            - name: eventbus
              containerPort: 15701
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
