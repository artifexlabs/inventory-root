# Released-version overlay: swap locally built images for the versioned
# images in the public Docker Hub namespace docker.io/artifexlabs (decided
# 2026-08-21; formerly private GHCR). Usage (from the workspace root):
#
#   INVENTORY_VERSION=1.2.3 docker compose --project-directory . \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.release.yml up -d
#
# `up` uses the named image when it exists locally and pulls it otherwise;
# it never builds. `docker compose ... pull` first to pre-fetch. The images
# are public — no login needed to pull.
services:

  migrate:
    image: docker.io/artifexlabs/inventory-migrate:${INVENTORY_VERSION:-latest}

  inventory-server:
    image: docker.io/artifexlabs/inventory-server:${INVENTORY_VERSION:-latest}

  inventory-web-api:
    image: docker.io/artifexlabs/inventory-web-api:${INVENTORY_VERSION:-latest}

  inventory-exporter:
    image: docker.io/artifexlabs/inventory-exporter:${INVENTORY_VERSION:-latest}

  inventory-web-app:
    image: docker.io/artifexlabs/inventory-web-app:${INVENTORY_VERSION:-latest}
