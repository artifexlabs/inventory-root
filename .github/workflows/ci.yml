# CI for the whole workspace: JVM build + tests of every module, run inside
# the same container developers use locally (see .devcontainer/). The runner's
# docker socket is mounted so Testcontainers/Dev Services work.
#
# Note: the devcontainer-image workflow must have published
# ghcr.io/mykelalvis/inventory-root/inventory-devcontainer:latest at least once before this
# can run (chicken-and-egg on the very first push only — and again on the
# push that RENAMED the image into the inventory-root namespace: re-run ci
# after devcontainer-image goes green).
name: ci

on:
  push:
    branches: [develop, master, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/inventory-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      # Testcontainers inside a container-with-host-socket: resource reaping
      # can't see our filesystem; disable ryuk, CI containers are short-lived.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      # .gitmodules uses SSH URLs (local workflow); CI fetches over HTTPS.
      # The rewrite must exist before checkout so its submodule handling
      # (which injects the token) sees HTTPS URLs.
      - name: Rewrite SSH GitHub URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      # GITHUB_TOKEN is scoped to this repo only; the submodules are private
      # sibling repos, so cloning them needs SUBMODULE_TOKEN — a fine-grained
      # PAT with contents:read on the inventory-* repos. NOTE (2026-08-19):
      # inventory-parent/api/impl moved to the artifexlabs org, so the PAT
      # must grant contents:read there too, or their checkout fails.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      # The lib submodules are NOT reactor modules (PLAN.md Phase 19): build
      # and install them in dependency order, then the app reactor consumes
      # them from the local repository. artifex-maven-parent resolves from
      # Central (io.artifexlabs.parents:artifex-maven-parent:2).
      - name: Build and install the libs (api -> impl -> bom)
        run: |
          for d in inventory-api inventory-impl-root inventory-bom; do
            mvn -B -ntp -f "$d/pom.xml" install
          done
      - name: Build and test the app modules
        run: mvn -B -ntp verify
