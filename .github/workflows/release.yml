# Phase 14: tag-driven formal releases. Pushing vX.Y.Z on the superproject
# builds the whole reactor at that version and publishes container images to
# the PUBLIC Docker Hub namespace docker.io/artifexlabs/<module> (decided
# 2026-08-21, superseding the private-GHCR destination). Images may be built
# from unreleased Maven artifacts — images can be removed or overwritten;
# Maven Central releases cannot, and happen separately (PLAN.md Phase 19).
#
# Images match what deploy/docker-compose.yml actually deploys: JVM images for the
# three bus members (the vertx-infinispan cluster manager is not yet proven
# under GraalVM native) and a native image for inventory-web-app.
#
# Runs on the bare runner, NOT inside the devcontainer image: the Quarkus
# native container-build bind-mounts the project directory into the builder
# container, and inside an Actions container job the workspace path exists
# only in the job container, not on the host — the mount would be empty.
# The runner therefore installs the same Maven the devcontainer pins.
name: release

on:
  push:
    tags: ['v*']

env:
  MAVEN_VERSION: 3.9.16

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # draft release
    steps:
      - name: Rewrite SSH GitHub URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      # Public sibling repos: the default GITHUB_TOKEN is enough (SUBMODULE_TOKEN
      # retired 2026-08-23). Checkout is read-only here; submodule tags are
      # mirrored locally by the release ceremony, never by CI.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maven ${{ env.MAVEN_VERSION }} and the JDK-21 toolchain
        run: |
          curl -fsSL -o /tmp/maven.tar.gz "https://dlcdn.apache.org/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            || curl -fsSL -o /tmp/maven.tar.gz "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          sudo tar -xz -C /opt -f /tmp/maven.tar.gz
          sudo ln -sf /opt/apache-maven-${MAVEN_VERSION}/bin/mvn /usr/local/bin/mvn
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF
          mvn -version
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The lib submodules are NOT reactor modules (PLAN.md Phase 19): build
      # and install them at their own literal versions, in dependency order;
      # -Drevision versions only the four apps.
      - name: Build and install the libs (parent -> api -> impl)
        run: |
          for d in inventory-parent inventory-api inventory-impl-root; do
            mvn -B -ntp -f "$d/pom.xml" clean install
          done
      - name: Build and test the reactor at the release version
        run: mvn -B -ntp verify -Drevision="$VERSION"
      - name: Native-image inventory-web-app
        run: |
          mvn -B -ntp -pl inventory-web-app -am package -Drevision="$VERSION" \
            -Dmaven.test.skip=true -Dnative -Dquarkus.native.container-build=true
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u artifexlabs --password-stdin
      - name: Build and push images
        run: |
          set -euo pipefail
          NS="artifexlabs"
          SRC="https://github.com/${{ github.repository }}"
          build_push() {  # module dockerfile
            local module="$1" dockerfile="$2"
            docker build \
              --label "org.opencontainers.image.source=${SRC}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              -f "${module}/src/main/docker/${dockerfile}" \
              -t "${NS}/${module}:${VERSION}" -t "${NS}/${module}:latest" \
              "${module}"
            docker push "${NS}/${module}:${VERSION}"
            docker push "${NS}/${module}:latest"
          }
          build_push inventory-server    Dockerfile.jvm
          build_push inventory-web-api   Dockerfile.jvm
          build_push inventory-projector  Dockerfile.jvm
          build_push inventory-web-app   Dockerfile.native
          # the versioned schema (Liquibase + changeset jar on the classpath)
          docker build \
            --label "org.opencontainers.image.source=${SRC}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -f inventory-impl-root/inventory-impl-changeset/src/main/docker/Dockerfile.migrate \
            -t "${NS}/inventory-migrate:${VERSION}" -t "${NS}/inventory-migrate:latest" \
            inventory-impl-root/inventory-impl-changeset
          docker push "${NS}/inventory-migrate:${VERSION}"
          docker push "${NS}/inventory-migrate:latest"
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          Platform release ${VERSION}. Images (public Docker Hub):

          \`\`\`
          artifexlabs/inventory-server:${VERSION}
          artifexlabs/inventory-web-api:${VERSION}
          artifexlabs/inventory-projector:${VERSION}
          artifexlabs/inventory-web-app:${VERSION}
          artifexlabs/inventory-migrate:${VERSION}
          \`\`\`

          Run this version:

          \`\`\`
          INVENTORY_VERSION=${VERSION} docker compose --project-directory . -f deploy/docker-compose.yml -f deploy/docker-compose.release.yml up -d
          \`\`\`

          Mobile apps release separately through their store tracks.
          EOF
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
