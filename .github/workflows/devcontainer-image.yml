# Publishes the dual-use build container to GHCR whenever it changes.
# ci.yml consumes ghcr.io/artifexlabs/inventory-root/inventory-devcontainer:latest.
# Both sides derive the path from ${{ github.repository }}, so it follows any
# rename or org transfer — but the image must be republished at the new path
# (workflow_dispatch) before ci.yml can pull it.
name: devcontainer-image

on:
  push:
    branches: [develop, master]
    paths: ['.devcontainer/**', '.github/workflows/devcontainer-image.yml']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "ghcr.io/${{ github.repository }}/inventory-devcontainer:latest" .devcontainer
      - name: Smoke the image
        run: docker run --rm "ghcr.io/${{ github.repository }}/inventory-devcontainer:latest" bash -lc "java -version && mvn -version && docker --version && git --version"
      - name: Push image
        run: docker push "ghcr.io/${{ github.repository }}/inventory-devcontainer:latest"
